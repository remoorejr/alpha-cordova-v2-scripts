services:
  builder:
    image: remoorejr/alpha-cordova-android-build:latest
    container_name: cordova-builder
    working_dir: /home/cordovauser/app

    command: sleep infinity
     
    volumes:
      - .:/home/cordovauser/app
      - ./android_cache:/home/cordovauser/.android
      - ./android_cache:/root/.android
      - platforms_cache:/home/cordovauser/app/platforms
      - modules_cache:/home/cordovauser/app/node_modules
      - plugins_cache:/home/cordovauser/app/plugins
      - gradle_cache:/home/cordovauser/.gradle
      - npm_cache:/home/cordovauser/.npm
      
      # 2. Cache the SDK platforms so they don't re-verify on every "Full Reset"
      - sdk_platforms:/opt/android-sdk/platforms
      - sdk_build_tools:/opt/android-sdk/build-tools

    network_mode: host
    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      - CI=true
      # Force internal container paths to prevent host SDK leakage
      - ANDROID_HOME=/opt/android-sdk
      - ANDROID_SDK_ROOT=/opt/android-sdk
      - JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
      # This tells the container's ADB to use the host's USB bridge
      - ADB_SERVER_SOCKET=tcp:host.docker.internal:5037
      
      # 04-30-26 edit
      - PATH=/opt/gradle/bin:/opt/android-sdk/cmdline-tools/latest/bin:/opt/android-sdk/platform-tools:/opt/android-sdk/build-tools/36.0.0:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      
      # Use developer identity from .env
      - GIT_AUTHOR_NAME=${GIT_USER_NAME:-Alpha Developer}
      - GIT_AUTHOR_EMAIL=${GIT_USER_EMAIL:-dev@alpha.com}
      - GIT_COMMITTER_NAME=${GIT_USER_NAME:-Alpha Developer}
      - GIT_COMMITTER_EMAIL=${GIT_USER_EMAIL:-dev@alpha.com}
      
      - GRADLE_USER_HOME=/home/cordovauser/.android
      - ANDROID_USER_HOME=/home/cordovauser/.android
    user: root 
    tty: true
    stdin_open: true

volumes:
  platforms_cache:
  modules_cache:
  plugins_cache:
  gradle_cache:        # This preserves all downloaded .jar files
  npm_cache:
  sdk_platforms:       # This preserves the Android 36 SDK files
  sdk_build_tools:     # This preserves the 36.0.0 build tools
